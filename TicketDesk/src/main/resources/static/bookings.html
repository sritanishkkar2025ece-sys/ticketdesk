<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TicketDesk | My Bookings</title>


    <style>

        /* =========================================
           BASIC RESET
        ========================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f3ff;
            color: #281044;
        }


        /* =========================================
           NAVBAR
        ========================================= */

        .navbar {
            height: 78px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            background: #ffffff;

            border-bottom: 1px solid #e9def7;

            position: sticky;
            top: 0;
            z-index: 100;
        }


        .logo {
            display: flex;
            align-items: center;
            gap: 11px;
        }


        .logo-icon {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background: linear-gradient(
                    135deg,
                    #7c3aed,
                    #9b5de5
            );

            color: white;

            font-size: 21px;
            font-weight: 800;

            box-shadow:
                    0 6px 15px rgba(124, 58, 237, 0.25);
        }


        .logo-text {
            font-size: 23px;
            font-weight: 800;

            color: #32145f;
        }


        .logo-text span {
            color: #8b5cf6;
        }


        nav {
            display: flex;
            align-items: center;
            gap: 34px;
        }


        nav a {
            position: relative;

            color: #74677f;

            text-decoration: none;

            font-size: 15px;
            font-weight: 600;

            padding: 28px 0 24px;

            transition: 0.2s;
        }


        nav a:hover {
            color: #6d28d9;
        }


        nav a.active {
            color: #6d28d9;
        }


        nav a.active::after {
            content: "";

            position: absolute;

            left: 0;
            right: 0;
            bottom: 15px;

            height: 2px;

            background: #6d28d9;

            border-radius: 10px;
        }


        .nav-button {
            border: none;

            padding: 11px 18px;

            border-radius: 10px;

            background: #6d28d9;

            color: white;

            font-weight: 700;

            cursor: pointer;
        }


        /* =========================================
           MAIN PAGE
        ========================================= */

        .bookings-page {

            min-height: calc(100vh - 78px);

            padding: 65px 7% 90px;

            background:
                    radial-gradient(
                            circle at 10% 10%,
                            rgba(124, 58, 237, 0.12),
                            transparent 30%
                    ),
                    linear-gradient(
                            180deg,
                            #fbf9ff,
                            #f5efff
                    );
        }


        /* =========================================
           HEADER
        ========================================= */

        .bookings-header {
            max-width: 1200px;

            margin: 0 auto 35px;
        }


        .section-label {

            margin-bottom: 12px;

            color: #7c3aed;

            font-size: 12px;

            font-weight: 800;

            letter-spacing: 2px;
        }


        .bookings-header h1 {

            font-size: 48px;

            line-height: 1.1;

            color: #2e1255;

            margin-bottom: 14px;
        }


        .bookings-header h1 span {
            color: #7c3aed;
        }


        .bookings-header p:last-child {

            color: #766a84;

            font-size: 16px;
        }


        /* =========================================
           BOOKING COUNT
        ========================================= */

        .booking-message {

            max-width: 1200px;

            margin: 0 auto 22px;

            color: #665777;

            font-size: 15px;

            font-weight: 600;
        }


        /* =========================================
           BOOKING GRID
        ========================================= */

        .booking-grid {

            max-width: 1200px;

            margin: 0 auto;

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 25px;
        }


        /* =========================================
           BOOKING CARD
        ========================================= */

        .booking-card {

            position: relative;

            min-height: 370px;

            display: flex;

            flex-direction: column;

            padding: 27px;

            background: #ffffff;

            border: 1px solid #e6dcf4;

            border-radius: 20px;

            box-shadow:
                    0 10px 30px
                    rgba(54, 25, 90, 0.08);

            overflow: hidden;

            transition: 0.25s ease;
        }


        .booking-card:hover {

            transform: translateY(-6px);

            box-shadow:
                    0 18px 40px
                    rgba(54, 25, 90, 0.14);
        }


        /* PURPLE TOP BORDER */

        .booking-card::before {

            content: "";

            position: absolute;

            left: 0;
            right: 0;
            top: 0;

            height: 5px;

            background:
                    linear-gradient(
                            90deg,
                            #6d28d9,
                            #8b5cf6,
                            #c084fc
                    );
        }


        /* =========================================
           CARD HEADER
        ========================================= */

        .booking-card-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 22px;
        }


        .booking-id {

            width: 45px;
            height: 45px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background: #f0e8ff;

            color: #6d28d9;

            font-size: 15px;

            font-weight: 800;
        }


        /* =========================================
           STATUS
        ========================================= */

        .booking-status {

            padding: 7px 13px;

            border-radius: 50px;

            background: #eee7ff;

            color: #6d28d9;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 0.5px;
        }


        /* =========================================
           TITLE
        ========================================= */

        .booking-card h2 {

            color: #32145f;

            font-size: 23px;

            margin-bottom: 20px;
        }


        /* =========================================
           DETAILS
        ========================================= */

        .booking-details {

            display: flex;

            flex-direction: column;

            margin-bottom: 25px;
        }


        .booking-detail {

            min-height: 45px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            border-bottom: 1px solid #eee8f6;
        }


        .booking-detail:last-child {

            border-bottom: none;
        }


        .booking-detail span {

            color: #81748f;

            font-size: 14px;
        }


        .booking-detail strong {

            color: #32145f;

            font-size: 14px;

            text-align: right;
        }


        /* =========================================
           CANCEL BUTTON
        ========================================= */

        .cancel-button {

            width: 100%;

            height: 46px;

            margin-top: auto;

            border: none;

            border-radius: 11px;

            background:
                    linear-gradient(
                            135deg,
                            #7c3aed,
                            #6d28d9
                    );

            color: white;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }


        .cancel-button:hover {

            transform: translateY(-2px);

            box-shadow:
                    0 8px 20px
                    rgba(109, 40, 217, 0.25);
        }


        /* =========================================
           CANCELLED
        ========================================= */

        .booking-card.cancelled {

            opacity: 0.82;
        }


        .booking-card.cancelled .booking-status {

            background: #eeeaf2;

            color: #77707f;
        }


        .booking-card.cancelled .cancel-button {

            background: #eeeaf2;

            color: #77707f;

            cursor: not-allowed;
        }


        .booking-card.cancelled .cancel-button:hover {

            transform: none;

            box-shadow: none;
        }


        /* =========================================
           NO BOOKINGS
        ========================================= */

        .no-bookings {

            grid-column: 1 / -1;

            padding: 70px 30px;

            text-align: center;

            background: white;

            border: 1px solid #e5daf3;

            border-radius: 20px;

            box-shadow:
                    0 10px 30px
                    rgba(54, 25, 90, 0.08);
        }


        .no-bookings h2 {

            color: #32145f;

            font-size: 27px;

            margin-bottom: 10px;
        }


        .no-bookings p {

            color: #756a83;

            margin-bottom: 22px;
        }


        .no-bookings a {

            display: inline-block;

            padding: 12px 22px;

            border-radius: 10px;

            background: #6d28d9;

            color: white;

            text-decoration: none;

            font-weight: 700;
        }


        /* =========================================
           FOOTER
        ========================================= */

        footer {

            padding: 45px 7%;

            background: #21102f;

            color: #aaa0b5;
        }


        .footer-logo {

            display: flex;

            align-items: center;

            gap: 11px;

            margin-bottom: 12px;
        }


        .footer-logo .logo-icon {

            width: 40px;
            height: 40px;
        }


        .footer-logo > span {

            color: white;

            font-size: 22px;

            font-weight: 800;
        }


        .footer-logo > span span {

            color: #b48cff;
        }


        footer p {

            font-size: 14px;
        }


        .footer-bottom {

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid rgba(255,255,255,0.1);

            font-size: 13px;
        }


        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 1000px) {

            .booking-grid {

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 650px) {

            .navbar {

                padding: 0 5%;
            }


            nav {

                gap: 15px;
            }


            nav a {

                font-size: 13px;
            }


            .nav-button {

                display: none;
            }


            .bookings-page {

                padding: 45px 5% 65px;
            }


            .bookings-header h1 {

                font-size: 38px;
            }


            .booking-grid {

                grid-template-columns: 1fr;

                gap: 18px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     NAVBAR
========================================= -->

<header class="navbar">

    <div class="logo">

        <div class="logo-icon">
            T
        </div>

        <div class="logo-text">
            Ticket<span>Desk</span>
        </div>

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="shows.html">
            Shows
        </a>

        <a href="bookings.html"
           class="active">
            My Bookings
        </a>

    </nav>


    <button
            class="nav-button"
            onclick="window.location.href='shows.html'">

        Explore Shows

    </button>

</header>



<!-- =========================================
     MAIN
========================================= -->

<main class="bookings-page">


    <section class="bookings-header">

        <p class="section-label">
            TICKETDESK BOOKINGS
        </p>


        <h1>
            My <span>Bookings</span>
        </h1>


        <p>
            View and manage all your show bookings.
        </p>

    </section>



    <div
            id="bookingMessage"
            class="booking-message">

        Loading bookings...

    </div>



    <section
            id="bookingGrid"
            class="booking-grid">

    </section>


</main>



<!-- =========================================
     FOOTER
========================================= -->

<footer>

    <div class="footer-logo">

        <div class="logo-icon">
            T
        </div>

        <span>
            Ticket<span>Desk</span>
        </span>

    </div>


    <p>
        Smart and simple ticket booking platform.
    </p>


    <div class="footer-bottom">

        © 2026 TicketDesk. All rights reserved.

    </div>

</footer>



<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="script.js"></script>


</body>

</html>
